<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene vr-mode-ui="enabled:false">

    <a-assets>
        <img id="pic1" src="picture1.jpg">
        <img id="pic2" src="picture2.jpg">
    </a-assets>

    <a-image
        src="#pic1"
        position="0 1.5 -3"
        width="1.2"
        height="1.2">
    </a-image>

    <a-image
        src="#pic2"
        position="2 1.5 -2"
        rotation="0 -45 0"
        width="1.2"
        height="1.2">
    </a-image>

    <a-camera
        look-controls="magicWindowTrackingEnabled:true">
    </a-camera>

</a-scene>

</body>
</html>
