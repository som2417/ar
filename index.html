<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        #intro {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
        }

        #introVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }
    </style>
</head>

<body>

    <!-- Intro overlay -->
    <div id="intro">
        <video
            id="introVideo"
            autoplay
            muted
            playsinline>
            <source src="intro.mp4" type="video/mp4">
        </video>
    </div>

    <!-- AR Scene -->
    <a-scene
        embedded
        arjs="sourceType: webcam;">

        <a-assets>
            <img id="pic1" src="picture1.jpg">
            <img id="pic2" src="picture2.jpg">
            <img id="pic3" src="picture3.jpg">
            <img id="pic4" src="picture4.jpg">
            <img id="pic5" src="picture5.jpg">
            <img id="pic6" src="picture6.jpg">
            <img id="pic7" src="picture7.jpg">
            <img id="pic8" src="picture8.jpg">
        </a-assets>

        <!-- Photo 1 -->
        <a-entity position="0 1.8 -5" rotation="2 0 -2">
            <a-plane position="0 0 -0.05"
                     width="1.6"
                     height="2"
                     color="#fff8e7"></a-plane>

            <a-image src="#pic1"
                     position="0 0.2 0.15"
                     width="1.2"
                     height="1.2"></a-image>

            <a-text value="Amar wife ar amar prothom dekha"
                    position="0 -0.75 0.15"
                    align="center"
                    color="black"
                    width="2"></a-text>
        </a-entity>

        <!-- Photo 2 -->
        <a-entity position="3.54 1.8 -3.54" rotation="-2 -45 3">
            <a-plane position="0 0 -0.05"
                     width="1.6"0
                     height="2"
                     color="#fff8e7"></a-plane>

            <a-image src="#pic2"
                     position="0 0.2 0.15"
                     width="1.2"
                     height="1.2"></a-image>

            <a-text value="Amar wife er gale amar prothom kiss"
                    position="0 -0.75 0.15"
                    align="center"
                    color="black"
                    width="2"></a-text>
        </a-entity>

        <!-- Photo 3 -->
        <a-entity position="5 1.8 0" rotation="1 -90 -4">
            <a-plane position="0 0 -0.05"
                     width="1.6"
                     height="2"
                     color="#fff8e7"></a-plane>

            <a-image src="#pic3"
                     position="0 0.2 0.15"
                     width="1.2"
                     height="1.2"></a-image>

            <a-text value="Amar wife ke amar banano"
                    position="0 -0.75 0.15"
                    align="center"
                    color="black"
                    width="2"></a-text>
        </a-entity>

        <!-- Photo 4 -->
        <a-entity position="3.54 1.8 3.54" rotation="-3 -135 2">
            <a-plane position="0 0 -0.05"
                     width="1.6"
                     height="2"
                     color="#fff8e7"></a-plane>

            <a-image src="#pic4"
                     position="0 0.2 0.15"
                     width="1.2"
                     height="1.2"></a-image>

            <a-text value="Amader prothom kiss"
                    position="0 -0.75 0.15"
                    align="center"
                    color="black"
                    width="4"></a-text>
        </a-entity>

        <!-- Photo 5 -->
        <a-entity position="0 1.8 5" rotation="2 180 -3">
            <a-plane position="0 0 -0.05"
                     width="1.6"
                     height="2"
                     color="#fff8e7"></a-plane>

            <a-image src="#pic5"
                     position="0 0.2 0.15"
                     width="1.2"
                     height="1.2"></a-image>

            <a-text value="Amader prothom jhogra"
                    position="0 -0.75 0.15"
                    align="center"
                    color="black"
                    width="2"></a-text>
        </a-entity>

        <!-- Photo 6 -->
        <a-entity position="-3.54 1.8 3.54" rotation="-1 135 4">
            <a-plane position="0 0 -0.05"
                     width="1.6"
                     height="2"
                     color="#fff8e7"></a-plane>

            <a-image src="#pic6"
                     position="0 0.2 0.15"
                     width="1.2"
                     height="1.2"></a-image>

            <a-text value="Amar wife er sathe prothom dol"
                    position="0 -0.75 0.15"
                    align="center"
                    color="black"
                    width="2"></a-text>
        </a-entity>

        <!-- Photo 7 -->
        <a-entity position="-5 1.8 0" rotation="3 90 -2">
            <a-plane position="0 0 -0.05"
                     width="1.6"
                     height="2"
                     color="#fff8e7"></a-plane>

            <a-image src="#pic7"
                     position="0 0.2 0.15"
                     width="1.2"
                     height="1.2"></a-image>

            <a-text value="Prothom bar Krishnanagar jawa, tao sosur bari niye gelona"
                    position="0 -0.75 0.15"
                    align="center"
                    color="black"
                    width="2"></a-text>
        </a-entity>

        <!-- Photo 8 -->
        <a-entity position="-3.54 1.8 -3.54" rotation="-2 45 3">
            <a-plane position="0 0 -0.05"
                     width="1.6"
                     height="2"
                     color="#fff8e7"></a-plane>

            <a-image src="#pic8"
                     position="0 0.2 0.15"
                     width="1.2"
                     height="1.2"></a-image>

            <a-text value="Amar wife"
                    position="0 -0.75 0.15"
                    align="center"
                    color="black"
                    width="3"></a-text>
        </a-entity>

        <a-camera></a-camera>

    </a-scene>

    <script>
        const intro = document.getElementById("intro");
        const video = document.getElementById("introVideo");

        video.addEventListener("ended", () => {
            intro.style.transition = "opacity 2s ease";
            intro.style.opacity = "0";

            setTimeout(() => {
                intro.remove();
            }, 2000);
        });
    </script>

</body>
</html>
