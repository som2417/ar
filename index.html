<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs>

    <a-assets>
        <img id="pic1" src="picture1.jpg">
        <img id="pic2" src="picture2.jpg">
        <img id="pic3" src="picture3.jpg">
        <img id="pic4" src="picture4.jpg">
        <img id="pic5" src="picture5.jpg">
        <img id="pic6" src="picture6.jpg">
        <img id="pic7" src="picture7.jpg">
        <img id="pic8" src="picture8.jpg">
    </a-assets>

<a-image src="#pic1"
         position="0 1.5 -5"
         rotation="0 0 0"
         width="3"
         height="3"></a-image>

<a-image src="#pic2"
         position="3.54 1.5 -3.54"
         rotation="0 -45 0"
         width="3"
         height="3"></a-image>

<a-image src="#pic3"
         position="5 1.5 0"
         rotation="0 -90 0"
         width="3"
         height="3"></a-image>

<a-image src="#pic4"
         position="3.54 1.5 3.54"
         rotation="0 -135 0"
         width="3"
         height="3"></a-image>

<a-image src="#pic5"
         position="0 1.5 5"
         rotation="0 180 0"
         width="3"
         height="3"></a-image>

<a-image src="#pic6"
         position="-3.54 1.5 3.54"
         rotation="0 135 0"
         width="3"
         height="3"></a-image>

<a-image src="#pic7"
         position="-5 1.5 0"
         rotation="0 90 0"
         width="3"
         height="3"></a-image>

<a-image src="#pic8"
         position="-3.54 1.5 -3.54"
         rotation="0 45 0"
         width="3"
         height="3"></a-image>

    <a-camera></a-camera>

</a-scene>

</body>
</html>
