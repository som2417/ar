<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs>

    <a-assets>
        <img id="pic1" src="picture1.jpg">
        <img id="pic2" src="picture2.jpg">
    </a-assets>

    <a-image
        src="#pic1"
        position="0 0 -3"
        width="1"
        height="1">
    </a-image>

    <a-image
        src="#pic2"
        position="2 0 -4"
        width="1"
        height="1">
    </a-image>

    <a-camera></a-camera>

</a-scene>

</body>
</html>
